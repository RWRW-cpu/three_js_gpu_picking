<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 线条拾取系统（顶点属性）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        #selectedInfo {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        .controls h3 {
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 5px;
        }
        .controls label {
            display: block;
            margin: 8px 0;
        }
        .controls input {
            width: 100%;
            margin-bottom: 10px;
        }
        .mode-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            background: #4CAF50;
            box-shadow: 0 0 8px #4CAF50;
        }
    </style>
</head>
<body>
    <div id="info"><span class="mode-indicator"></span>点击线条来选中它们<br>当前模式: 渲染视图</div>
    <div id="selectedInfo">未选中任何线条</div>
    
    <div class="controls">
        <h3>线条控制</h3>
        <label>
            <input type="checkbox" id="rotateScene" checked> 旋转场景
        </label>
        <label>
            <input type="range" id="lineWidth" min="1" max="10" value="5" step="0.5"> 线条宽度
        </label>
        <label>
            <input type="range" id="animationSpeed" min="0" max="2" value="0.5" step="0.1"> 动画速度
        </label>
    </div>

    <script>
        // 场景设置
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 10;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // 存储线条映射关系
        const idToLine = new Map();
        let selectedLineId = null;
        let rotationEnabled = true;
        let animationSpeed = 0.5;
        
        // 编码和解码函数
        function encodeNodeID(nodeID) {
            return new THREE.Vector4(
                ((nodeID >> 24) & 255) / 255,
                ((nodeID >> 16) & 255) / 255,
                ((nodeID >> 8) & 255) / 255,
                (nodeID & 255) / 255
            );
        }
        
        function decodeNodeID(color) {
            const r = Math.floor(color.r * 255);
            const g = Math.floor(color.g * 255);
            const b = Math.floor(color.b * 255);
            const a = Math.floor(color.a * 255);
            return (r << 24) + (g << 16) + (b << 8) + a;
        }
        
        // 全局拾取材质
        const pickingMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                attribute vec4 nodeID;
                varying vec4 vNodeID;
                
                void main() {
                    vNodeID = nodeID;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec4 vNodeID;
                
                void main() {
                    gl_FragColor = vNodeID;
                }
            `
        });
        
        // 创建线函数（使用顶点属性）
        function createLine(points, color, lineWidth = 5, nodeID) {
            // 实际渲染用的线材质
            const material = new THREE.LineBasicMaterial({ 
                color: color,
                linewidth: lineWidth
            });

            // 创建几何体
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, material);
            
            // 为每个顶点添加nodeID属性
            const vertexCount = points.length;
            const nodeIDArray = new Float32Array(vertexCount * 4);
            const encodedID = encodeNodeID(nodeID);
            
            for (let i = 0; i < vertexCount; i++) {
                const offset = i * 4;
                nodeIDArray[offset] = encodedID.x;
                nodeIDArray[offset + 1] = encodedID.y;
                nodeIDArray[offset + 2] = encodedID.z;
                nodeIDArray[offset + 3] = encodedID.w;
            }
            
            geometry.setAttribute('nodeID', new THREE.BufferAttribute(nodeIDArray, 4));
            
            // 存储映射关系
            idToLine.set(nodeID, {
                renderLine: line,
                originalColor: color
            });

            // 添加到场景
            scene.add(line);

            return line;
        }
        
        // 创建示例线条
        function createSampleLines() {
            const colors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff];
            const lineCount = 8;
            
            for (let i = 0; i < lineCount; i++) {
                const points = [];
                const radius = 3 + i * 0.3;
                const angle = (i / lineCount) * Math.PI * 2;
                
                for (let j = 0; j < 15; j++) {
                    const height = j - 7;
                    points.push(new THREE.Vector3(
                        Math.cos(angle) * radius,
                        height * 0.4,
                        Math.sin(angle) * radius
                    ));
                }
                
                createLine(points, colors[i % colors.length], 5, i + 1);
            }
        }
        
        // 创建拾取渲染目标
        const pixelBuffer = new Uint8Array(4);
        const pickingTexture = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
        
        // 处理点击事件
        function onMouseClick(event) {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // 先渲染拾取场景，使用 overrideMaterial
            renderer.setRenderTarget(pickingTexture);
            scene.overrideMaterial = pickingMaterial;
            renderer.render(scene, camera);
            scene.overrideMaterial = null;
            
            // 读取像素
            renderer.readRenderTargetPixels(
                pickingTexture, 
                (mouse.x * 0.5 + 0.5) * window.innerWidth, 
                (mouse.y * 0.5 + 0.5) * window.innerHeight, 
                1, 1, pixelBuffer
            );
            
            // 解码nodeID
            const color = {
                r: pixelBuffer[0] / 255,
                g: pixelBuffer[1] / 255,
                b: pixelBuffer[2] / 255,
                a: pixelBuffer[3] / 255
            };
            
            const nodeID = decodeNodeID(color);
            
            // 恢复渲染目标
            renderer.setRenderTarget(null);
            
            // 高亮选中的线条
            idToLine.forEach((lineData, id) => {
                if (id === nodeID) {
                    lineData.renderLine.material.color.set(0xffffff);
                    lineData.renderLine.material.linewidth = 8;
                    selectedLineId = id;
                } else {
                    lineData.renderLine.material.color.set(lineData.originalColor);
                    lineData.renderLine.material.linewidth = document.getElementById('lineWidth').value;
                }
            });
            
            // 更新选中信息
            if (nodeID > 0) {
                document.getElementById('selectedInfo').textContent = 
                    `已选中线条 #${nodeID}`;
            } else {
                document.getElementById('selectedInfo').textContent = 
                    "未选中任何线条";
                selectedLineId = null;
            }
        }
        
        // 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 旋转场景
            if (!rotationEnabled) {
                scene.rotation.y += 0.005 * animationSpeed;
            }
            
            renderer.render(scene, camera);
        }
        
        // 初始化
        function init() {
            createSampleLines();
            window.addEventListener('click', onMouseClick, false);
            
            // 响应窗口大小变化
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                pickingTexture.setSize(window.innerWidth, window.innerHeight);
            });
            
            // 设置控件事件
            document.getElementById('rotateScene').addEventListener('change', function(e) {
                rotationEnabled = e.target.checked;
            });
            
            document.getElementById('lineWidth').addEventListener('input', function(e) {
                const width = parseFloat(e.target.value);
                idToLine.forEach((lineData, id) => {
                    if (id !== selectedLineId) {
                        lineData.renderLine.material.linewidth = width;
                    }
                });
            });
            
            document.getElementById('animationSpeed').addEventListener('input', function(e) {
                animationSpeed = parseFloat(e.target.value);
            });
            
            animate();
        }
        
        init();
    </script>
</body>
</html>
