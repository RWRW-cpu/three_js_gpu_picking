<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 线条拾取系统（顶点属性）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>

</head>

<body>
    <script type="module">

        // 场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        // 相机
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 5);



        // 渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);


        // 设置Z轴向上
        camera.up.set(0, 0, 1);

        // 控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);


        // // 0,0,0 创建坐标轴辅助
        // const axesHelper = new THREE.AxesHelper(5);
        // axesHelper.position.set(0, 0, 0);
        // axesHelper.material.depthTest = false; // 关闭深度测试
        // axesHelper.renderOrder = 1; // 渲染顺序设为1
        // scene.add(axesHelper);


        // 创建一个1x1x1的立方体
        const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
        const boxMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
        const cube = new THREE.Mesh(boxGeometry, boxMaterial);
        cube.position.set(0, 0, 0); // 放置在原点
        scene.add(cube);



        // 创建红外线圆柱群体
        function createLaser(startPoint, endPoint, segment, between, alpha, radius) {
            const group = new THREE.Group();
            const distance = startPoint.distanceTo(endPoint);
            const direction = new THREE.Vector3().subVectors(endPoint, startPoint).normalize();
            
            // 计算垂直于方向的向量用于偏移
            // 使用更通用的方法计算垂直向量
            let perpendicular = new THREE.Vector3();
            if (Math.abs(direction.x) > 0.001 || Math.abs(direction.y) > 0.001) {
                perpendicular.set(-direction.y, direction.x, 0).normalize();
            } else {
                // 如果方向向量接近Z轴，使用X轴作为垂直向量
                perpendicular.set(1, 0, 0);
            }
            
            // 如果提供了 alpha 角度，绕方向向量旋转垂直向量
            if (alpha !== undefined && alpha !== 0) {
                const rotationQuaternion = new THREE.Quaternion();
                rotationQuaternion.setFromAxisAngle(direction, alpha * Math.PI / 180);
                perpendicular.applyQuaternion(rotationQuaternion);
            }
            
            // 计算总宽度和每个圆柱体的偏移量
            const totalWidth = between * (segment - 1);
            const startOffset = -totalWidth / 2 + radius;
            
            for (let i = 0; i < segment; i++) {
                const geometry = new THREE.CylinderGeometry(radius, radius, distance, 32);
                const material = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const cylinder = new THREE.Mesh(geometry, material);
                
                // 设置四元数旋转
                const quaternion = new THREE.Quaternion();
                quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
                cylinder.setRotationFromQuaternion(quaternion);
                
                // 设置位置（圆柱体的中心点）
                const center = new THREE.Vector3().addVectors(startPoint, endPoint).multiplyScalar(0.5);
                cylinder.position.copy(center);
                
                // 添加横向偏移以实现并排排列
                const offset = startOffset + i * (totalWidth / (segment - 1));
                cylinder.position.addScaledVector(perpendicular, offset);
                
                group.add(cylinder);
            }
            
            return group;
        }

        // 使用示例
        const start = new THREE.Vector3(0.5, 0, 0);
        const end = new THREE.Vector3(0.5, 0, 1);
        let radius = 0.001; // 圆柱的半径
        let segment = 10;  // 圆柱的数量
        let between =0.1; // 圆柱之间的间距
        let alpha = 90;   // 绕中心的圆柱旋转角度
        const laser = createLaser(start, end, segment, between, alpha, radius);
        scene.add(laser);

        // 渲染场景
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        const laser2 = createLaser(new THREE.Vector3(0, 0.5, 0), new THREE.Vector3(1, 0.5, 1), segment, between, alpha, radius);
        scene.add(laser2);

        // laser2的角度跟laser成正交90度
        laser2.rotation.z = Math.PI / 2;
        animate();



    </script>
</body>
